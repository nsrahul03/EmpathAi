<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Empath AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
        }

        video {
            width: 100%;
            max-width: 700px;
            border-radius: 15px;
            background: black;
        }

        .emotion {
            font-size: 30px;
            font-weight: bold;
            margin-top: 25px;
        }

        .confidence {
            font-size: 18px;
            color: #94a3b8;
            margin-top: 10px;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .status {
            margin-top: 15px;
            color: #94a3b8;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🧠 Empath AI</h1>

    <p class="subtitle">
        Real-Time Emotion Detection & Interactive AI Assistant
    </p>


    <div class="card">

        <video
            id="camera"
            autoplay
            playsinline>
        </video>


        <div class="emotion">

            Detected Emotion:
            <span id="emotion">—</span>

        </div>


        <div class="confidence">

            Confidence:
            <span id="confidence">—</span>

        </div>


        <div class="status" id="status">

            Starting camera...

        </div>

    </div>

</div>


<script>

const video =
    document.getElementById("camera");

const emotion =
    document.getElementById("emotion");

const confidence =
    document.getElementById("confidence");

const status =
    document.getElementById("status");


async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: true
            });

        video.srcObject = stream;

        status.textContent =
            "Camera started";

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Camera permission denied";

    }

}


async function detectEmotion() {

    if (video.readyState < 2) {
        return;
    }


    const canvas =
        document.createElement("canvas");


    canvas.width = 320;
    canvas.height = 240;


    const context =
        canvas.getContext("2d");


    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    const image =
        canvas.toDataURL("image/jpeg");


    try {

        const response =
            await fetch("/predict", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    image: image
                })

            });


        const data =
            await response.json();


        if (data.error) {

            console.error(data.error);

            return;

        }


        emotion.textContent =
            data.emotion;


        confidence.textContent =
            data.confidence + "%";


        status.textContent =
            "Emotion detection active";

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Prediction server error";

    }

}


startCamera();

setInterval(
    detectEmotion,
    1000
);

</script>

</body>

</html>
