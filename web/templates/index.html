<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EmpathAI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #camera-container {
            position: relative;
            display: inline-block;
        }

        video {
            width: 640px;
            max-width: 90vw;
            border-radius: 10px;
        }

        #face-box {
            position: absolute;
            border: 3px solid lime;
            display: none;
            pointer-events: none;
        }

        #result {
            margin-top: 20px;
            font-size: 24px;
        }

        #status {
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>EmpathAI</h1>
    <p>Real-Time Facial Emotion Detection</p>

    <div id="camera-container">

        <video id="video" autoplay playsinline></video>

        <div id="face-box"></div>

    </div>

    <canvas id="canvas" width="640" height="480" hidden></canvas>

    <div id="result">
        Emotion: <strong id="emotion">Waiting...</strong>
        <br>
        Confidence: <strong id="confidence">0%</strong>
    </div>

    <p id="status">Starting camera...</p>

    <script>

        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");

        const emotionText = document.getElementById("emotion");
        const confidenceText = document.getElementById("confidence");
        const statusText = document.getElementById("status");

        const faceBox = document.getElementById("face-box");

        // Start webcam
        async function startCamera() {

            try {

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                video.srcObject = stream;

                statusText.textContent = "Camera started";

            } catch (error) {

                statusText.textContent =
                    "Unable to access camera: " + error.message;

            }
        }


        // Send webcam frame to Flask
        async function detectEmotion() {

            if (video.readyState !== 4) {
                return;
            }

            const context = canvas.getContext("2d");

            // Draw current webcam frame
            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            // Convert image to base64
            const image = canvas.toDataURL("image/jpeg");

            try {

                const response = await fetch("/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        image: image
                    })

                });

                const result = await response.json();


                // No face detected
                if (!result.face_detected) {

                    emotionText.textContent = "No face detected";
                    confidenceText.textContent = "0%";

                    faceBox.style.display = "none";

                    statusText.textContent =
                        "Please place your face in front of the camera.";

                    return;
                }


                // Display emotion
                emotionText.textContent = result.emotion;

                confidenceText.textContent =
                    result.confidence + "%";

                statusText.textContent =
                    "Face detected successfully";


                // Display face rectangle
                const face = result.face;

                const scaleX = video.clientWidth / canvas.width;
                const scaleY = video.clientHeight / canvas.height;

                faceBox.style.display = "block";

                faceBox.style.left =
                    (face.x * scaleX) + "px";

                faceBox.style.top =
                    (face.y * scaleY) + "px";

                faceBox.style.width =
                    (face.width * scaleX) + "px";

                faceBox.style.height =
                    (face.height * scaleY) + "px";


            } catch (error) {

                statusText.textContent =
                    "Prediction error: " + error.message;

            }
        }


        startCamera();

        // Detect emotion every second
        setInterval(detectEmotion, 1000);

    </script>

</body>
</html>
